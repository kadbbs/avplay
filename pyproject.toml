[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamforge-gateway"
version = "0.1.0"
description = "FFmpeg based RTSP/RTMP/HLS/WebRTC streaming gateway lab."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
streamctl = "streamforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
